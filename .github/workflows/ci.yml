name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: 6.12.0
  # Keep in step with the vcpkg used for local and release builds: protobuf 6.33.4, abseil 20260107.1, gtest 1.17.0.
  VCPKG_COMMIT: 39344dff01c5a5a0134caf2624cdd492f05d30ea
  VCPKG_TRIPLET: x64-mingw-dynamic
  # GCC 15.2, mingw-w64 v14, msvcrt, posix threads: the same toolchain shape as local builds, and an
  # msvcrt runtime like Qt's mingw_64 kit. Qt's own tools_mingw1510 cannot be used: its mingw-w64 v12
  # libmingw32.a carries UCRT-only _Exit/quick_exit wrappers, so gtest fails to link against msvcrt.
  WINLIBS_RELEASE: 15.2.0posix-14.0.0-msvcrt-r7
  WINLIBS_ASSET: winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64msvcrt-14.0.0-r7.zip
  WINLIBS_SHA256: 9cd587d91ee7910dd8f9087e4bf9ac6b59a7ee594e1360601ba8a05355b9cefa

jobs:
  build-and-test:
    name: Build and test (MinGW)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt, CMake and Ninja
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_mingw
          tools: tools_cmake,qt.tools.cmake tools_ninja,qt.tools.ninja
          # TODO(2026-11-17): Switch back to aqtversion once an aqtinstall release after 3.3.0 ships.
          # 3.3.0 looks for qt6_6120/qt6_6120/Updates.xml; Qt 6.11+ publishes Windows kits in
          # per-arch folders (qt6_6120/qt6_6120_mingw/), which only aqtinstall master understands.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@5a49f2b391ae8ee1d3c0dd87f8b33c1d49a4deb7
          cache: true

      - name: Cache MinGW
        id: winlibs-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/winlibs
          key: winlibs-${{ env.WINLIBS_RELEASE }}

      - name: Download MinGW
        if: steps.winlibs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP/$env:WINLIBS_ASSET"
          Invoke-WebRequest -Uri "https://github.com/brechtsanders/winlibs_mingw/releases/download/$env:WINLIBS_RELEASE/$env:WINLIBS_ASSET" -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLower()
          if ($actual -ne $env:WINLIBS_SHA256) { throw "SHA-256 mismatch for ${zip}: $actual" }
          7z x -y -bd "-o$env:RUNNER_TEMP/winlibs" $zip | Out-Null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # The runner image's own GCCs (Strawberry Perl, C:/mingw64) must never be picked up instead:
      # vcpkg's x64-mingw-dynamic libraries only load against the runtime DLLs of the compiler that built them.
      - name: Resolve toolchain paths
        shell: pwsh
        run: |
          $tools = $env:IQTA_TOOLS.Replace('\', '/')
          $qt = $env:QT_ROOT_DIR.Replace('\', '/')
          $mingw = "$($env:RUNNER_TEMP.Replace('\', '/'))/winlibs/mingw64/bin"
          $vcpkg = "$($env:RUNNER_TEMP.Replace('\', '/'))/vcpkg"
          $installed = "$vcpkg/installed/$env:VCPKG_TRIPLET"
          foreach ($required in "$mingw/gcc.exe", "$tools/CMake_64/bin/cmake.exe", "$tools/Ninja/ninja.exe", "$qt/lib/cmake/Qt6") {
            if (-not (Test-Path $required)) {
              Get-ChildItem $tools | Format-Table -AutoSize | Out-String | Write-Host
              throw "Expected install path is missing: $required"
            }
          }
          # GITHUB_PATH entries are prepended, so this MinGW wins over every other gcc on the image.
          $mingw >> $env:GITHUB_PATH
          @(
            "VCPKG_ROOT=$vcpkg"
            "VCPKG_BINARY_CACHE=$($env:RUNNER_TEMP.Replace('\', '/'))/vcpkg-binary-cache"
            "KSV_TOOLCHAIN=mingw"
            "KSV_CMAKE_EXE=$tools/CMake_64/bin/cmake.exe"
            "KSV_NINJA_EXE=$tools/Ninja/ninja.exe"
            "KSV_C_COMPILER=$mingw/gcc.exe"
            "KSV_CXX_COMPILER=$mingw/c++.exe"
            "KSV_VCPKG_TOOLCHAIN=$vcpkg/scripts/buildsystems/vcpkg.cmake"
            "KSV_VCPKG_BIN_DIR=$installed/bin"
            "KSV_PROTOC_EXE=$installed/tools/protobuf/protoc.exe"
            "KSV_QT_BIN_DIR=$qt/bin"
            "KSV_QT6_DIR=$qt/lib/cmake/Qt6"
          ) >> $env:GITHUB_ENV

      - name: Check compiler
        shell: pwsh
        run: |
          (Get-Command gcc).Source
          gcc --version

      - name: Fetch vcpkg
        shell: pwsh
        run: |
          git init --quiet $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT fetch --quiet --depth 1 https://github.com/microsoft/vcpkg $env:VCPKG_COMMIT
          git -C $env:VCPKG_ROOT checkout --quiet FETCH_HEAD
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # A package's ABI hash covers more than this key: the triplet passes PATH through, and vcpkg
      # also hashes the CMake and PowerShell versions, so a runner image update can invalidate every
      # archive under an unchanged key. Cache entries are immutable, so each save gets a new key and
      # the restore takes the newest entry by prefix; a stale entry is simply never read again and
      # expires after 7 days.
      - name: Restore vcpkg packages
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_TRIPLET }}-${{ env.WINLIBS_RELEASE }}-${{ github.run_id }}
          restore-keys: vcpkg-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_TRIPLET }}-${{ env.WINLIBS_RELEASE }}-

      - name: Install protobuf and gtest
        id: vcpkg-install
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_BINARY_CACHE | Out-Null
          $restored = @(Get-ChildItem $env:VCPKG_BINARY_CACHE -Recurse -Filter *.zip | ForEach-Object BaseName | Sort-Object)
          $env:VCPKG_BINARY_SOURCES = "clear;files,$env:VCPKG_BINARY_CACHE,readwrite"
          & "$env:VCPKG_ROOT/vcpkg.exe" install protobuf gtest `
            --triplet $env:VCPKG_TRIPLET --host-triplet $env:VCPKG_TRIPLET --clean-after-build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # The installed tree is fresh every run, so every Abi in the status database (and its
          # not-yet-compacted updates) names an archive this run used; any other archive is dead and
          # would otherwise be carried into every later save.
          $db = "$env:VCPKG_ROOT/installed/vcpkg"
          $live = @(Get-ChildItem "$db/status", "$db/updates/*" -File -ErrorAction SilentlyContinue |
            Select-String -Pattern '^Abi: ([0-9a-f]+)$' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          if (-not $live) { throw "No Abi entries found under $db" }
          Get-ChildItem $env:VCPKG_BINARY_CACHE -Recurse -Filter *.zip |
            Where-Object BaseName -notin $live | Remove-Item
          $kept = @(Get-ChildItem $env:VCPKG_BINARY_CACHE -Recurse -Filter *.zip | ForEach-Object BaseName | Sort-Object)
          $changed = ($restored -join ',') -ne ($kept -join ',')
          "changed=$($changed.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "vcpkg archives: $($restored.Count) restored, $($kept.Count) kept, changed=$changed"

      # Only main writes: its entries are the ones every branch and PR can read.
      - name: Save vcpkg packages
        if: steps.vcpkg-install.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_BINARY_CACHE }}
          key: vcpkg-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_TRIPLET }}-${{ env.WINLIBS_RELEASE }}-${{ github.run_id }}

      - uses: astral-sh/setup-uv@v6

      - name: Build and run tests
        run: uv run python scripts/build_and_test.py

      - name: qmllint
        run: uv run python scripts/build_and_test.py --scope qmllint

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-and-test-logs
          path: .temp/build-and-test/
          if-no-files-found: ignore

  script-tests:
    name: Script tests (pytest)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: pytest
        run: uv run pytest

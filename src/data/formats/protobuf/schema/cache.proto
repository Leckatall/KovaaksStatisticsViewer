edition = "2023";

package cache;

// On-disk cache of a domain::UserProfile, so the app doesn't have to
// re-scan and re-decode every .perf file on disk on every launch.
message UserProfileCache {
  repeated ScenarioRuns scenarios = 1;
}

message ScenarioRuns {
  ScenarioId id = 1;
  repeated ScenarioPerf perfs = 2;
}

message ScenarioId {
  string name = 1;
  string hash = 2;
}

message ScenarioPerf {
  ScenarioId scenario_id = 1;
  int64 start_time = 2;
  float scenario_length = 3;
  repeated ScenarioDataPoint data = 4;
}

message ScenarioDataPoint {
  float time = 1;
  int32 shots = 2;
  int32 hits = 3;
  int32 misses = 4;
  float dmg = 5;
  float dmg_possible = 6;
  float score = 7;
  int32 kills = 8;
}

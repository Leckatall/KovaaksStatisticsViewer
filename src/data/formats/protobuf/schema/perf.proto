edition = "2023";

package perf;

message PerfLog {

  ScenarioMeta meta = 1;

  repeated PerfEntry entries = 2;
}

message ScenarioMeta {
  // Known
  string scenario_name = 1;   // e.g. "1w3ts reload"
  string scenario_hash = 2;   // e.g. md5-like hex
  int64 timestamp_ms = 3;     // e.g. 1785161014000

  // Unknown so far
  uint32 mode_or_version = 4; // seen as 1 in sample

  ScenarioDetails details = 5;
}

message ScenarioDetails {
  // Known-ish / inferred
  float scenario_length = 1;      // 0x42700000 -> 60.0
  string actor_name = 2;                 // "Player"
  repeated string target_ids = 3;        // repeated "target.bot"

  // Unknown; keep as bytes until proven text/numeric
  bytes unk5 = 5;                        // "\000\000\000"
  uint32 unk6 = 6;                       // 1
  bytes unk7 = 7;                        // "\000\000\000"

  string map_name = 8;                   // "cube_1wall_dense.map"
  float unk9 = 9;                        // 4.0
  float unk10 = 10;                      // 1.0
}

message U32Val {
  uint32 value = 1;
}

message F32Val {
  float value = 1;
}

// One timepoint entry (old level-0 field 2)
message PerfEntry {
  // old level-1 field 1 (seen as 0xXXXXXXXX in your decode; likely float bits)
  float time = 1;

  U32Val  shots = 2;
  U32Val  hits = 3;
  U32Val  misses = 4;
  F32Val dmg = 5;
  F32Val dmg_possible = 6;
  F32Val score = 7;
  U32Val kills = 8;

}


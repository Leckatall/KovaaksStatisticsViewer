edition = "2023";

package store;

// Authoritative on-disk record of the user's runs, including runs whose
// original .perf files are no longer available.
message UserProfileStore {
  // Schema version. Bumped when the on-disk layout changes incompatibly so
  // the loader can quarantine a rejected store instead of silently
  // mis-parsing it. Absent in pre-versioning stores, which read back as 0.
  uint32 version = 3;
  string source_directory = 1;
  repeated Run runs = 2;
}

message Run {
  ScenarioId scenario_id = 1;
  int64 start_time = 2;
  float scenario_length = 3;
  repeated ScenarioDataPoint data = 4;
  string source_file = 5;
}

message ScenarioId {
  string name = 1;
  string hash = 2;
}

message ScenarioDataPoint {
  float time = 1;
  int32 shots = 2;
  int32 hits = 3;
  int32 misses = 4;
  float dmg = 5;
  float dmg_possible = 6;
  float score = 7;
  int32 kills = 8;
}
